<svg xmlns="http://www.w3.org/2000/svg" width="380" height="230" viewBox="0 0 380 230" role="img" aria-labelledby="title desc">
  <title id="title">100만 회원 배치 처리 시간 95.4% 단축</title>
  <desc id="desc">100만 회원 등급 갱신의 전체 실행 시간이 기존 19분 13초에서 53초로 줄었습니다. 막대 길이는 1,153초와 53초의 비율입니다.</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#334155;font-size:18px}.strong{font-weight:700}.blue{fill:#2563eb}.muted{fill:#64748b}</style>
  <rect width="380" height="230" fill="#fff"/>
  <text x="12" y="28" class="strong">100만 회원 등급 갱신</text>
  <text x="12" y="64" class="strong blue" style="font-size:24px">처리 시간 95.4% 단축</text>
  <text x="12" y="108" class="muted">기존</text>
  <text x="368" y="108" text-anchor="end" class="strong">19분 13초</text>
  <rect x="12" y="121" width="356" height="24" rx="2" fill="#cbd5e1"/>
  <text x="12" y="178" class="blue">개선</text>
  <text x="368" y="178" text-anchor="end" class="strong blue">53초</text>
  <rect x="12" y="191" width="16.3642671292" height="24" rx="2" fill="#2563eb"/>
</svg>

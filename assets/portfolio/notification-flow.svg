<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">주문 응답과 외부 알림 전송의 비동기 분리</title>
  <desc id="desc">기존에는 주문 처리 후 외부 알림 전송을 기다려야 주문 응답을 반환했습니다. 개선 후에는 주문 처리, Redis Streams 이벤트 적재, 주문 응답 순서로 진행하고 Consumer Group이 외부 알림을 비동기로 전송합니다. 미처리 메시지는 PEL에서 회수해 재전송하고 재시도 한도를 넘으면 DLQ로 격리합니다.</desc>
  <defs>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:23px;fill:#334155;text-anchor:middle}
    .label{font-size:23px;font-weight:700;text-anchor:start}.blue{fill:#2563eb}.muted{fill:#64748b}.small{font-size:22px}
    .node{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.active{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}
    .gray-line{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#arrow-gray)}.blue-line{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#arrow-blue)}
  </style>
  <rect width="900" height="440" fill="#fff"/>
  <text x="28" y="79" class="label muted">기존</text>
  <rect class="node" x="166" y="39" width="180" height="66" rx="4"/>
  <text x="256" y="80">주문 처리</text>
  <path class="gray-line" d="M346 72H421"/>
  <rect class="node" x="432" y="39" width="204" height="66" rx="4"/>
  <text x="534" y="80">외부 전송 대기</text>
  <path class="gray-line" d="M636 72H703"/>
  <rect class="node" x="714" y="39" width="158" height="66" rx="4"/>
  <text x="793" y="80">주문 응답</text>
  <line x1="28" y1="132" x2="872" y2="132" stroke="#e2e8f0"/>
  <text x="28" y="204" class="label blue">개선</text>
  <rect class="active" x="166" y="159" width="180" height="66" rx="4"/>
  <text x="256" y="200">주문 처리</text>
  <path class="blue-line" d="M346 192H421"/>
  <rect class="active" x="432" y="159" width="204" height="66" rx="4"/>
  <text x="534" y="186" class="blue">이벤트 적재</text>
  <text x="534" y="212" class="small muted">Redis Streams</text>
  <path class="blue-line" d="M636 192H703"/>
  <rect class="active" x="714" y="159" width="158" height="66" rx="4"/>
  <text x="793" y="200" class="blue">주문 응답</text>
  <path class="blue-line" d="M534 225V264"/>
  <text x="615" y="254" class="small muted">비동기 전송</text>
  <rect class="active" x="432" y="275" width="204" height="59" rx="4"/>
  <text x="534" y="312">Consumer Group</text>
  <path class="blue-line" d="M636 304H645"/>
  <rect class="node" x="656" y="275" width="216" height="59" rx="4"/>
  <text x="764" y="312" class="small">PUSH / SMS / 알림톡</text>
  <path class="gray-line" d="M432 304H247V365"/>
  <text x="331" y="294" class="small muted">미처리 메시지</text>
  <rect class="node" x="166" y="376" width="164" height="44" rx="4"/>
  <text x="248" y="406">PEL</text>
  <path class="gray-line" d="M330 398H421"/>
  <rect class="active" x="432" y="376" width="204" height="44" rx="4"/>
  <text x="534" y="406">회수 후 재전송</text>
  <path class="gray-line" d="M636 398H703"/>
  <text x="754" y="363" class="small muted">재시도 한도 초과</text>
  <rect class="node" x="714" y="376" width="158" height="44" rx="4"/>
  <text x="793" y="406">DLQ 격리</text>
</svg>

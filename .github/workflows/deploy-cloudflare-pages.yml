name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  schedule:
    # 매일 14:30 UTC (KST 23:30)
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      apply_comments_migrations:
        description: Apply pending comments D1 migrations before deployment
        required: false
        type: boolean
        default: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler: '2.3.27'
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate required Cloudflare deployment config
        env:
          CF_PAGES_PROJECT_NAME: ${{ secrets.CF_PAGES_PROJECT_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMENTS_D1_DB_ID: ${{ secrets.COMMENTS_D1_DB_ID }}
          CF_SITE_ORIGIN: ${{ secrets.CF_SITE_ORIGIN }}
        run: |
          if [ -z "${CF_PAGES_PROJECT_NAME}" ] || [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] || [ -z "${COMMENTS_D1_DB_ID}" ]; then
            echo "::error::Cloudflare 배포에 필요한 GitHub Secret이 누락되어 있습니다. CF_PAGES_PROJECT_NAME, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, COMMENTS_D1_DB_ID 모두 필요합니다."
            exit 1
          fi
          if [ -z "${CF_SITE_ORIGIN}" ]; then
            echo "::error::Cloudflare 배포 도메인 설정이 필요합니다. secrets.CF_SITE_ORIGIN 값에 https://도메인 형태로 입력하세요."
            exit 1
          fi
          case "${CF_SITE_ORIGIN}" in
            https://* ) ;;
            http://* )
              echo "::warning::CF_SITE_ORIGIN이 https가 아닌 http입니다. 운영 배포는 https 권장됩니다."
              ;;
            * )
              echo "::error::CF_SITE_ORIGIN은 https:// 도메인 형태여야 합니다."
              exit 1
              ;;
          esac

      - name: Render runtime configs for deployment
        env:
          CF_SITE_ORIGIN: ${{ secrets.CF_SITE_ORIGIN }}
        run: |
          sed "s#https://your-cloudflare-domain.pages.dev#${CF_SITE_ORIGIN}#g" _config.yml > _config.runtime.yml
          sed "s#https://your-cloudflare-domain.pages.dev#${CF_SITE_ORIGIN}#g" _config_cf.yml > _config_cf.runtime.yml

      - name: Fetch GA4 stats (latest)
        run: |
          npm install --no-save @google-analytics/data
          node scripts/fetch_ga4.mjs
        env:
          GA4_PROPERTY_ID: '550723670'
          GA4_HOSTNAME: minstack.pages.dev
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}

      - name: Check daily visitor threshold
        id: ga4_alert
        run: node scripts/ga4_daily_alert.mjs
        env:
          GA4_ALERT_THRESHOLD: '2'

      - name: Notify daily visitor threshold
        if: github.event_name == 'schedule' && steps.ga4_alert.outputs.notify == 'true'
        uses: actions/github-script@v7
        env:
          REPORT_DATE: ${{ steps.ga4_alert.outputs.date }}
          ACTIVE_USERS: ${{ steps.ga4_alert.outputs.active_users }}
          SESSIONS: ${{ steps.ga4_alert.outputs.sessions }}
          PAGE_VIEWS: ${{ steps.ga4_alert.outputs.page_views }}
        with:
          script: |
            const title = `[MinStack] ${process.env.REPORT_DATE} 활성 사용자 ${process.env.ACTIVE_USERS}명`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            if (!issues.some((issue) => !issue.pull_request && issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                assignees: [context.repo.owner],
                body: [
                  `전날 활성 사용자가 설정한 기준 2명을 초과했습니다.`,
                  ``,
                  `- 활성 사용자: ${process.env.ACTIVE_USERS}명`,
                  `- 세션: ${process.env.SESSIONS}회`,
                  `- 페이지뷰: ${process.env.PAGE_VIEWS}회`,
                  `- GA4 Property: 550723670`,
                ].join('\n'),
              });
            }

      - name: Build for Cloudflare Pages
        run: bundle exec jekyll build --config _config.runtime.yml,_config_cf.runtime.yml
        env:
          JEKYLL_ENV: production

      - name: Apply comments schema migration
        if: github.event_name == 'workflow_dispatch' && inputs.apply_comments_migrations
        env:
          COMMENTS_D1_DB_ID: ${{ secrets.COMMENTS_D1_DB_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply COMMENTS_DB --remote --config wrangler.toml

      - name: Deploy to Cloudflare Pages
        env:
          CF_PAGES_PROJECT_NAME: ${{ secrets.CF_PAGES_PROJECT_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy _site \
            --project-name "${CF_PAGES_PROJECT_NAME}" \
            --commit-dirty=true

name: Temporary legacy GitHub Pages deploy
on:
  workflow_dispatch:
permissions:
  actions: read
  pages: write
  id-token: write
concurrency:
  group: legacy-pages-deploy
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download known-good legacy artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 32514332474
          name: github-pages
          path: /tmp/legacy-artifact
      - name: Extract legacy site
        run: |
          mkdir -p /tmp/legacy-site
          tar -xf /tmp/legacy-artifact/artifact.tar -C /tmp/legacy-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/legacy-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

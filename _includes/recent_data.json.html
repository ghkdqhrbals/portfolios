{% comment %}Recent docs dataset. Undated docs use their Git last-modified date.{% endcomment %}
{% assign docs_all = site.pages | where_exp: 'p','p.path contains "docs/" and p.recent_sort_date' | sort: 'recent_sort_date' | reverse %}
<template id="recent-data">[
{% for p in docs_all %}
{% assign summary = p.summary | default: p.description | default: p.content | strip_html | normalize_whitespace | truncate: 150 %}
{"date":"{{ p.recent_display_date }}","title":{{ p.title | jsonify }},"url":"{{ p.url | relative_url }}","summary":{{ summary | jsonify }}}{% unless forloop.last %},{% endunless %}
{% endfor %}
]</template>

<style>
  :root { --ms-accent:#3b82f6; --ms-accent-soft:rgba(59,130,246,.12); --ms-ink:#18202a; --ms-muted:#7b8794; --ms-line:#e6eaf0; --ms-panel:#f7f8fa; }
  html[data-theme="dark"] { --ms-ink:#eef2f7; --ms-muted:#9aa6b2; --ms-line:#2b333d; --ms-panel:#171c22; }
  .site-header { display:flex; align-items:center; gap:10px; padding:18px 16px !important; }
  .side-bar .site-header { display:flex !important; align-items:center !important; justify-content:flex-start !important; width:100% !important; min-height:64px !important; box-sizing:border-box !important; padding:14px 18px !important; background:transparent !important; }
  .side-bar .site-title { flex:1 1 auto !important; width:auto !important; min-width:0 !important; margin:0 !important; padding:0 !important; color:var(--ms-ink) !important; background:transparent !important; font-size:20px !important; font-weight:600; letter-spacing:-.035em; line-height:36px; text-decoration:none; }
  #main-header { position:relative; }
  .minstack-hero { display:none; }
  .minstack-kicker,.recent-eyebrow { display:none; }
  .minstack-hero h1 { margin:0 0 12px; color:var(--ms-ink); font-size:clamp(2.2rem,5vw,4rem); line-height:1; letter-spacing:-.07em; }
  .minstack-hero p:not(.minstack-kicker) { max-width:620px; margin:0; color:var(--ms-muted); font-size:16px; line-height:1.65; }
  .minstack-hero-meta { display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:22px; color:var(--ms-muted); font-family:var(--mono-font-family,monospace); font-size:11px; }
  .recent-root.recent-root { margin-top:38px; padding-top:0; border-top:0; }
  .recent-toolbar { align-items:end; margin-bottom:14px; }
  .recent-heading { margin:0 0 3px !important; color:var(--ms-ink); font-size:1.35rem !important; letter-spacing:-.04em !important; border:0 !important; padding:0 !important; }
  .recent-meta { font-size:12px; }
  .recent-list li { display:grid; grid-template-columns:92px minmax(0,1fr) 140px; gap:14px; align-items:start; padding:14px 0 !important; border-bottom:1px solid var(--ms-line); }
  .recent-list .r-date { padding-top:3px; font-family:var(--mono-font-family,monospace); font-size:11px; }
  .recent-list .r-title { gap:5px; }
  .recent-list .r-title a { font-size:16px; font-weight:600; letter-spacing:-.02em; }
  .recent-list .r-summary { font-size:13px; line-height:1.5; }
  .recent-list .r-image { width:140px; height:92px; border-radius:8px; object-fit:cover; background:var(--ms-line); }
  .recent-stats { display:flex; gap:10px; margin-top:7px; color:var(--ms-muted); font-family:var(--mono-font-family,monospace); font-size:10px; letter-spacing:.01em; }
  .recent-stat { display:inline-flex; align-items:center; gap:3px; }
  .recent-stat::before { display:inline-block; color:currentColor; font-family:Arial,sans-serif; font-size:12px; line-height:1; }
  .recent-stat--like::before { content:"♡"; }
  .recent-stat--comment::before { content:"▢"; font-size:11px; }
  html[data-theme="dark"] .comment-menu { background:#252a31 !important; border-color:#454e59 !important; }
  html[data-theme="dark"] .comment-menu__item { color:#f1f4f7 !important; }
  html[data-theme="dark"] .comment-menu__item:hover { background:#343d48 !important; }
  @media (max-width:899px) {
    body { overflow-x:hidden; }
    .side-bar { display:flex !important; flex-flow:row wrap !important; align-items:stretch !important; position:relative !important; width:100% !important; max-width:none !important; height:auto !important; max-height:none !important; overflow:visible !important; box-shadow:none !important; }
    .side-bar .site-header { min-height:60px !important; padding:11px 14px !important; }
    .side-bar .site-title { font-size:18px !important; }
    #site-nav { display:none !important; position:static !important; width:100% !important; height:auto !important; max-height:55vh !important; min-height:0 !important; overflow-x:hidden !important; overflow-y:auto !important; flex:0 0 100% !important; }
    #site-nav.nav-open { display:block !important; }
    #menu-button { display:flex !important; }
    .main { width:100% !important; max-width:none !important; margin-left:0 !important; }
    #recent-root.recent-root { text-align:left !important; }
    #recent-root .recent-toolbar { display:flex !important; flex-direction:column !important; align-items:flex-start !important; justify-content:flex-start !important; text-align:left !important; gap:10px !important; }
    #recent-root .recent-toolbar > div { width:100% !important; text-align:left !important; }
    #recent-root .recent-heading, #recent-root .recent-meta { display:block !important; text-align:left !important; }
    #recent-root .recent-pagination { justify-content:flex-start !important; align-self:flex-start !important; }
    .side-bar > .visit-stats { flex:0 0 100% !important; width:100% !important; box-sizing:border-box !important; margin-top:0 !important; }
  }
  @media (max-width:700px) { .site-header { padding:14px 12px !important; } .minstack-hero { margin-top:0; padding-top:22px; } .recent-list li { grid-template-columns:1fr 78px; gap:2px 10px; } .recent-list .r-date { grid-column:1 / -1; padding-top:0; } .recent-list .r-title { grid-column:1; } .recent-list .r-image { grid-column:2; grid-row:2; width:78px; height:78px; } }
</style>
<script src="{{ '/assets/js/minstack_ui.js' | relative_url }}" defer></script>

{% if page.tags %}
  <div class="post-tags-panel" aria-label="Post tags">
    <ul class="post-tag-list" aria-label="Tags">
      {% for tag in page.tags %}
        <li class="post-tag">
          <a href="{{ '/tags/' | append: '#' | append: tag | relative_url }}">{{ tag }}</a>
        </li>
      {% endfor %}
    </ul>
  </div>
{% endif %}

<style>
	/* Minimal clean tech blog enhancements */
	.brand-inline {display:flex;align-items:baseline;gap:10px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
	.brand-inline .site-title {font-size:18px;font-weight:600;letter-spacing:.5px;color:#1f2937;text-decoration:none;}
	.brand-inline .site-desc {font-size:12px;color:#6b7280;font-weight:400;margin-top:2px;}
	/* Body readability */
	.main-content {font-size:15px;letter-spacing:0;line-height:1.62;}
	.main-content p {line-height:1.62;}
	.main-content h1,.main-content h2,.main-content h3 {font-weight:600;letter-spacing:0;}
	.main-content h2 {margin-top:2.25em;padding-top:.15em;border-top:1px solid #edf1f5;}
	/* Lists spacing */
	.main-content li {margin:4px 0;}
	/* Links - subtle underline on hover */
	.main-content a:not(.btn){text-decoration:none;border-bottom:1px solid rgba(99,102,241,.25);transition:border-color .2s,background-color .2s;}
	.main-content a:not(.btn):hover{border-color:#2563eb;background:rgba(37,99,235,.06);} 
	/* Inline code: baseline/height alignment */
	.main-content :not(pre, figure) > code {
		font-size: 0.85em !important;
		line-height: 1 !important;
		padding: 0 0.25em !important;
		background: #f3f4f6 !important;
		background-clip: content-box !important;
		color: #d6492e !important;
		border: none !important;
		vertical-align: baseline;
	}
	/* Blockquote cleaner */
	blockquote {background:#f9fafb;border-left:4px solid #2563eb !important;padding:10px 14px !important;border-radius:4px;margin:18px 0 !important;}
	blockquote p {margin:0.4em 0;}
	/* Table style */
	.main-content table {font-size:14px;}
	.main-content table th {background:#f3f4f6;font-weight:600;}
	/* Utility badge */
	.badge {display:inline-block;background:#2563eb;color:#fff;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:500;letter-spacing:.4px;}
	/* Site header alignment tweak */
	#main-header {align-items:center;}
	.mobile-header-actions {display:none;}
	.main-header-actions {
		position:fixed;
		top:0;
		right:12px;
		z-index:2;
		display:flex;
		align-items:center;
		justify-content:center;
		height:60px;
		margin-left:0;
		flex:0 0 auto;
		white-space:nowrap;
	}
	.main-header-actions .aux-nav {
		flex:0 0 auto;
		overflow:visible;
	}
	.main-header > .search {
		box-sizing:border-box;
		padding-right:132px !important;
	}
	.main-header > .search .search-input-wrap {
		width:calc(100% - 132px) !important;
	}
	@media (max-width: 899px) {
		.site-header {
			min-height:52px;
		}
		.site-header .site-title {
			min-width:0;
			padding-right:8px;
		}
		.mobile-header-actions {
			display:flex;
			align-items:center;
			justify-content:center;
			flex:0 0 auto;
			height:52px;
			margin-left:auto;
		}
		.mobile-header-actions .theme-toggle {
			width:30px;
			height:30px;
			margin:0 2px 0 0;
		}
		.mobile-header-actions .theme-toggle__icon {
			width:16px;
			height:16px;
		}
		.site-header .site-button:hover,
		.site-header .site-button:focus,
		.site-header .site-button:active,
		.site-header .site-button.nav-open {
			background:#eef4ff !important;
			background-image:none !important;
		}
		#main-header.nav-open {
			display:none !important;
		}
		#main-header {position:relative;}
		.main-header-actions {
			position:absolute;
			top:0;
			right:8px;
			height:56px;
			z-index:3;
		}
		.main-header-actions .aux-nav .aux-nav-list {
			display:flex;
			align-items:center;
			height:100%;
		}
		.main-header-actions .aux-nav .aux-nav-list-item {
			height:auto;
		}
		.main-header-actions .aux-nav .aux-nav-list-item a {
			padding:3px !important;
		}
		.main-header-actions .aux-nav .aux-nav-list-item a img {
			width:18px;
			height:18px;
		}
		.main-header-actions .theme-toggle {
			width:28px;
			height:28px;
			margin-right:2px;
		}
		.main-header-actions .theme-toggle__icon {
			width:15px;
			height:15px;
		}
		.main-header > .search {
			padding-right:98px !important;
		}
		.main-header > .search .search-input-wrap {
			width:calc(100% - 98px) !important;
		}
	}
	@media (max-width: 360px) {
		.main-header-actions {
			right:6px;
		}
		.main-header-actions .aux-nav .aux-nav-list-item a {
			padding:2px !important;
		}
		.main-header-actions .aux-nav .aux-nav-list-item a img {
			width:17px;
			height:17px;
		}
		.main-header-actions .theme-toggle {
			width:26px;
			height:26px;
			margin-right:0;
		}
		.main-header-actions .theme-toggle__icon {
			width:14px;
			height:14px;
		}
		.main-header > .search {
			padding-right:88px !important;
		}
		.main-header > .search .search-input-wrap {
			width:calc(100% - 88px) !important;
		}
	}
	.search-results,
	.search-results * {
		box-sizing:border-box;
	}
	.search-results h1,
	.search-results h2,
	.search-results h3,
	.search-results h4,
	.search-results h5,
	.search-results h6 {
		display:inline !important;
		margin:0 !important;
		padding:0 !important;
		border:0 !important;
		font:inherit !important;
		letter-spacing:0 !important;
		color:inherit !important;
	}
	.search-results .anchor-heading,
	.search-results .anchor-heading svg {
		display:none !important;
	}
	.search-result {
		overflow:hidden;
		background:inherit;
	}
	.search-result-doc-title,
	.search-result-section,
	.search-result-preview {
		overflow-wrap:anywhere;
	}
	.search-active .main-header-actions {
		display:none !important;
	}
	.search-active .main-header {
		position:relative !important;
		z-index:2147482999 !important;
	}
	.search-active .search {
		z-index:1000;
	}
	.search-active .search::before {
		content:"";
		position:absolute;
		top:0;
		left:0;
		width:100%;
		height:100%;
		background:#fff;
		z-index:0;
		pointer-events:none;
	}
	.search-active .search-input-wrap {
		z-index:2;
		background:#fff;
	}
	.search-active .search-results {
		position:absolute !important;
		z-index:2147483000 !important;
		overflow-y:auto;
		background:#fff !important;
		opacity:1 !important;
		isolation:isolate;
		contain:paint;
	}
	.search-active .search-results::before {
		content:"";
		position:absolute;
		inset:0;
		z-index:0;
		background:#fff;
		pointer-events:none;
	}
	.search-active .search-results-list,
	.search-active .search-no-result {
		position:relative;
		z-index:1;
	}
	.search-active .search-overlay {
		display:none !important;
		width:0 !important;
		height:0 !important;
		opacity:0 !important;
		pointer-events:none !important;
	}
	.site-header,
	.main-header {
		position:relative;
		border-top:0 !important;
		border-bottom:0 !important;
		box-shadow:none !important;
	}

	/* --- Sidebar 구분선 & 시각적 그룹 향상 --- */
	.side-bar {--sb-divider:#e5e7eb;}
	.side-bar .nav-category {position:relative;padding:10px 14px 4px;font-size:12px;font-weight:600;letter-spacing:.5px;color:#374151;text-transform:uppercase;opacity:.9;}
	.side-bar .nav-category:not(:first-of-type){margin-top:10px;}
	/* 위쪽 구분선 */
	.side-bar .nav-category:not(:first-of-type)::before {content:"";position:absolute;left:12px;right:12px;top:0;height:1px;background:linear-gradient(90deg,rgba(0,0,0,0),var(--sb-divider),rgba(0,0,0,0));}
	/* nav-list item 경계선 */
	.side-bar .nav-list > .nav-list-item {position:relative;}
	.side-bar .nav-list > .nav-list-item + .nav-list-item {margin-top:2px;}
	.side-bar .nav-list > .nav-list-item > .nav-list-link {border-radius:6px;padding:6px 12px;line-height:1.3;}
	.side-bar .nav-list > .nav-list-item > .nav-list-link:hover {background:#f3f4f6;}
	/* 첫/마지막 그룹 안쪽 패딩 정돈 */
	.side-bar nav.site-nav {padding-top:6px;padding-bottom:14px;}
	/* depth 2 이하 가이드 라인 (왼쪽 세로 라인) */
	.side-bar .nav-list .nav-list {margin-left:10px;border-left:1px solid #edf0f3;padding-left:6px;}
	/* active 강조 */
	.side-bar .nav-list .nav-list-item.active > .nav-list-link {background:#eaf2ff;color:#0f3e8c;font-weight:600;}
	/* external link 아이콘 있는 행도 동일 패딩 */
	.side-bar .nav-list-item.external > .nav-list-link {padding:6px 12px;border-radius:6px;}
	/* 스크롤 시 카테고리 헤더 배경 살짝 고정 */
	.side-bar .nav-category {background:linear-gradient(#fff,#fff) padding-box;}
	/* 구분 감각 강화: 카테고리 바로 아래 첫 리스트 상단 얇은 라인 */
	.side-bar .nav-category + ul.nav-list {margin-top:4px;padding-top:4px;border-top:1px dashed #e2e8f0;}
	/* 모바일 폭 좁을 때 지나친 라인 축소 */
	@media (max-width:640px){
		.side-bar .nav-list .nav-list {border-left:none;margin-left:4px;padding-left:10px;}
	}

	/* Sidebar 무채색 계열 재정의 */
	.side-bar .nav-list-link {color:#4b5563;}
	.side-bar .nav-list > .nav-list-item > .nav-list-link:hover {background:#f1f2f3;color:#111;}
	.side-bar .nav-list .nav-list-item.active > .nav-list-link {background:#dfe2e6;color:#111;font-weight:600;}
	.side-bar .nav-category {color:#555;}
	/* focus/keyboard 접근성 */
	.side-bar .nav-list-link:focus {outline:2px solid #9ca3af;outline-offset:1px;}
	/* 중첩 리스트 링크도 동일하게 */
	.side-bar .nav-list .nav-list .nav-list-link:hover {background:#f5f6f7;}

	/* ===== Sidebar Light Option A (화이트 + 연회색) ===== */
	.side-bar {background:#ffffff !important;color:#374151;box-shadow:1px 0 0 #edeff1;}
	.side-bar a {border:0 !important;}
	.side-bar .site-title {color:#1f2937 !important;}
	/* .avatar 제거됨 */
	.side-bar .nav-category {color:#5a6068 !important;letter-spacing:.6px;}
	.side-bar .nav-category::before {background:linear-gradient(90deg,rgba(255,255,255,0),#e5e7eb,rgba(255,255,255,0)) !important;}
	.side-bar .nav-category + ul.nav-list {border-top:1px dashed #e5e7eb !important;}
	.side-bar .nav-list-link {color:#3d4650 !important;}
	.side-bar .nav-list > .nav-list-item > .nav-list-link {background:transparent;}
	.side-bar .nav-list > .nav-list-item > .nav-list-link:hover {background:#f5f7f9 !important;color:#111 !important;}
	.side-bar .nav-list .nav-list-item.active > .nav-list-link {background:#eef1f5 !important;color:#111 !important;font-weight:600;}
	.side-bar .nav-list .nav-list {border-left:1px solid #eceff2 !important;}
	.side-bar .nav-list .nav-list .nav-list-link:hover {background:#f3f5f7 !important;}
	/* 클릭/포커스 시 기존 외곽선 대신 명암 강조 */
	.side-bar .nav-list-link {transition:background .18s ease,color .18s ease, box-shadow .18s ease;}
	.side-bar .nav-list-link:focus,
	.side-bar .nav-list-link:focus-visible,
	.side-bar .nav-list-link:active {outline:none !important;box-shadow:none !important;}
	.side-bar .nav-list-link:focus,
	.side-bar .nav-list-link:focus-visible {background:#e9edf1 !important;}
	.side-bar .nav-list-link:active {background:#d3d8dd !important;}
	/* 활성 항목 (클릭 후 유지) */
	.side-bar .nav-list-item.active > .nav-list-link {background:#d7dce1 !important;color:#111 !important;font-weight:600;}
	.side-bar .nav-list-link svg {filter:none;}
	/* Sidebar 카운트 배지 */
	.side-bar .nav-count {display:inline-block;min-width:20px;padding:2px 6px;margin-right:6px;border-radius:12px;background:#eef1f4;color:#44505a;font-size:11px;font-weight:600;text-align:center;line-height:1;vertical-align:middle;letter-spacing:.5px;}
	.side-bar .nav-list-item.active > .nav-list-link .nav-count {background:#dce2e8;color:#222;}
	.side-bar .nav-title {vertical-align:middle;}
	/* Sidebar 날짜 스타일 (작고 옅은 캡션) */
	.side-bar .nav-date {display:block;font-size:11px;line-height:1.1;margin-bottom:2px;font-weight:600;letter-spacing:.15em;color:#8a9096;text-transform:uppercase;}
	.side-bar .nav-list-item.active > .nav-list-link .nav-date {color:#636b72;}
	/* 메인 카테고리 차별화 */
	.side-bar .nav-category.main-cat {font-size:13px;letter-spacing:.8px;color:#1e2934 !important;margin-top:18px;padding:12px 14px 6px;font-weight:700;position:relative;}
	.side-bar .nav-category.main-cat:first-of-type {margin-top:4px;}
	.side-bar .nav-category.main-cat::after {content:"";position:absolute;left:14px;right:14px;bottom:2px;height:2px;background:#11111110;border-radius:2px;}
	.side-bar .nav-category.main-cat + ul.nav-list {border-top:none !important;padding-top:2px;}
	/* 메인 카테고리 바로 아래 1차 링크 강조 */
	.side-bar .nav-category.main-cat + ul.nav-list > .nav-list-item > .nav-list-link {font-weight:500;}

	/* Sidebar 전용 폰트 (가독성 향상) */
	.side-bar, .side-bar .nav-category, .side-bar .nav-list-link, .side-bar .site-title {
		font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif !important;
		font-feature-settings: "liga" 1, "kern" 1;
		-webkit-font-smoothing: antialiased;
	}
	/* 링크 자간 약간 조정 */
	.side-bar .nav-list-link {letter-spacing:.2px;}
</style>
<style>
	.theme-toggle {
		display:inline-flex;
		align-items:center;
		height:32px;
		width:32px;
		margin-right:8px;
		padding:0;
		justify-content:center;
		border:0;
		border-radius:50%;
		background:transparent;
		color:#374151;
		font-size:12px;
		font-weight:650;
		line-height:1;
		cursor:pointer;
		transition:transform .16s cubic-bezier(.2,.8,.2,1), opacity .18s ease;
	}
	.theme-toggle:hover {background:transparent;color:#111;opacity:.78;}
	.theme-toggle:active {transform:scale(.88);}
	.theme-toggle:focus-visible {outline:1px solid #94a3b8;outline-offset:3px;}
	.theme-toggle__icon {
		position:relative;
		display:block;
		width:17px;
		height:17px;
		border-radius:50%;
		background:#0f172a;
		box-shadow:0 0 0 1px rgba(15,23,42,.08), inset -6px -3px 0 #94a3b8;
		transform:rotate(-18deg);
		transition:
			background-color .28s cubic-bezier(.2,.8,.2,1),
			box-shadow .28s cubic-bezier(.2,.8,.2,1),
			transform .34s cubic-bezier(.2,.8,.2,1);
	}
	.theme-toggle__icon::before,
	.theme-toggle__icon::after {
		content:"";
		position:absolute;
		left:50%;
		top:50%;
		border-radius:50%;
		pointer-events:none;
		transition:opacity .24s ease, transform .34s cubic-bezier(.2,.8,.2,1);
	}
	.theme-toggle__icon::before {
		width:4px;
		height:4px;
		background:currentColor;
		transform:translate(-50%,-50%) scale(0);
		opacity:0;
		box-shadow:
			0 -10px 0 currentColor,
			0 10px 0 currentColor,
			10px 0 0 currentColor,
			-10px 0 0 currentColor,
			7px 7px 0 currentColor,
			-7px -7px 0 currentColor,
			7px -7px 0 currentColor,
			-7px 7px 0 currentColor;
	}
	.theme-toggle__icon::after {
		width:17px;
		height:17px;
		background:#fff;
		transform:translate(-30%,-58%) scale(1);
		opacity:.96;
	}
	.theme-toggle--animating .theme-toggle__icon {
		transform:rotate(180deg) translateY(-1px);
	}

	html.theme-changing body,
	html.theme-changing .main,
	html.theme-changing #main-content-wrap,
	html.theme-changing .main-header,
	html.theme-changing .side-bar,
	html.theme-changing .main-content,
	html.theme-changing .main-content *,
	html.theme-changing .recent-list li,
	html.theme-changing .search-input,
	html.theme-changing .search-results,
	html.theme-changing .content-index-sidebar__inner {
		transition:
			background-color .28s ease,
			color .28s ease,
			border-color .28s ease,
			box-shadow .28s ease !important;
	}

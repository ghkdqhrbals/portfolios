<section id="comments-widget" class="comments-widget" data-post-path="{{ page.url }}">
  <h2 id="comments-title">댓글</h2>

  <p id="comments-message" class="comments-message" role="status" aria-live="polite"></p>

  <form id="comment-form" class="comment-form" autocomplete="off">
    <div class="comment-form__row">
      <label for="comment-nickname" class="comment-form__label">닉네임</label>
    <input id="comment-nickname" name="nickname" type="text" required maxlength="40" class="comment-form__input" placeholder="닉네임">
    </div>
    <div class="comment-form__row">
      <label for="comment-password" class="comment-form__label">비밀번호</label>
    <input id="comment-password" name="password" type="password" required minlength="4" maxlength="64" class="comment-form__input" placeholder="댓글 수정/삭제용 비밀번호">
    </div>
    <div class="comment-form__row">
      <label for="comment-body" class="comment-form__label">댓글</label>
    <textarea id="comment-body" name="body" class="comment-form__textarea" required maxlength="5000" rows="4" placeholder="내용을 입력하세요."></textarea>
    </div>
    <button type="submit" class="comment-form__submit">댓글 등록</button>
  </form>

  <ul id="comments-list" class="comments-list" aria-live="polite"></ul>

  <p class="comments-note">수정/삭제는 본문 작성 시 등록한 비밀번호가 필요합니다. 신고 버튼은 신고 사유를 Slack으로 전달합니다.</p>
</section>

<script src="{{ '/assets/js/comments.js' | relative_url }}" defer></script>

<section id="comments-widget" class="comments-widget" data-post-path="{{ page.url }}">
  <button id="post-like-button" class="post-like-button" type="button" aria-pressed="false">좋아요 0</button>
  <p id="comments-message" class="comments-message" role="status" aria-live="polite"></p>

  <form id="comment-form" class="comment-form" autocomplete="off">
    <div class="comment-form__identity">
      <input id="comment-nickname" name="nickname" type="text" required maxlength="40" class="comment-form__input" placeholder="닉네임">
      <input id="comment-password" name="password" type="password" required minlength="4" maxlength="64" class="comment-form__input" placeholder="비밀번호">
    </div>
    <div class="comment-form__row">
      <textarea id="comment-body" name="body" class="comment-form__textarea" required maxlength="5000" rows="2" placeholder="댓글을 입력하세요."></textarea>
    </div>
    <div class="comment-form__actions">
      <button type="submit" class="comment-form__submit">등록</button>
    </div>
  </form>

  <ul id="comments-list" class="comments-list" aria-live="polite"></ul>
</section>

<script src="{{ '/assets/js/comments.js' | relative_url }}" defer></script>

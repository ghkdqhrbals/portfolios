services:

  blog-api:
    build:
      context: ./
      dockerfile: Dockerfile.python
    ports:
      - 8000:8000
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
    command: python guestbook.py

  mcp:
    build:
      context: ./
      dockerfile: Dockerfile.python
    ports:
      - 8080:8080
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8080
    command: python api/mcp_server.py --transport streamable-http
